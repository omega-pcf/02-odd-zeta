name = "odd_zeta"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["F1_pentagonal_descent_UNIFIED"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
maxRecDepth = 400000
maxHeartbeats = 10000000

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "a8754b1890a7f7f1c859d48281cb84a1fce64139"

[[lean_lib]]
name = "F1_pentagonal_descent_UNIFIED"
