[project]
name = "02-odd-zeta"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mpmath>=1.3.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "python-flint>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/src"]
addopts = "--tb=short -p no:cacheprovider"
markers = [
    "slow: marks tests that take >10 s (deselect with '-m \"not slow\"')",
    "golden: compares a committed output of tests/fixtures/ (salidas/, datos/ or the script's own directory) against the manuscript figures",
    "witness: contract between the manuscript's \\testref tags and the suite",
]
